<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flights - Travexa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1 style="text-align:center; margin-top:50px;">Search Flights ✈️</h1>

    <div style="text-align:center; margin-top:30px;">
        <form method="POST" action="/search-flights">
            <input type="text" name="from_city" placeholder="From City" required>
            <input type="text" name="to_city" placeholder="To City" required>
            <input type="date" name="date" required>
            <button type="submit">Search</button>
        </form>
    </div>
</body>
</html>
