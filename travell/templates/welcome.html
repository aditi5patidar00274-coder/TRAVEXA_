<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Travexa | Elevate Your Journey</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        /* Complete Override for Welcome Page Light Theme */
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background: #f4f6f9;
        }

        .welcome-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Dynamic Background */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 1;
            animation: slowZoom 30s infinite alternate linear;
        }

        .bg-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.55) 0%, rgba(240, 245, 255, 0.15) 100%);
            z-index: 1;
        }

        @keyframes slowZoom {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.15);
            }
        }

        /* Left Side: Branding */
        .hero-section {
            flex: 1.2;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 10%;
            color: #111827;
        }

        .travexa-logo {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeIn 1s ease-out;
        }

        .travexa-box {
            background: #ef4444;
            /* Signature Red */
            padding: 5px 18px;
            border-radius: 12px;
            transform: rotate(-3deg);
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
            color: white;
        }

        .hero-title {
            font-size: clamp(3.5rem, 6vw, 6rem);
            font-weight: 900;
            line-height: 1.05;
            margin: 0;
            text-transform: uppercase;
            color: #111827;
            text-shadow: 0 4px 30px rgba(255, 255, 255, 0.9);
            animation: slideUp 1s ease-out;
        }

        .hero-subtitle {
            font-size: 1.3rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            color: #010915;
            margin-top: 1.5rem;
            max-width: 500px;
            line-height: 1.6;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9);
            animation: slideUp 1.2s ease-out;
            opacity: 0.95;
        }

        /* Right Side: Auth Glass */
        .auth-section {
            flex: 0.8;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.6);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 1);
            border-radius: 30px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            animation: fadeIn 1.2s ease-out;
            color: #111827;
            transition: all 0.4s ease;
        }

        .glass-panel:hover {
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12);
        }

        .auth-tabs {
            display: flex;
            gap: 25px;
            margin-bottom: 35px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.05);
            padding-bottom: 12px;
        }

        .auth-tab {
            font-size: 1.3rem;
            font-weight: 600;
            color: #9ca3af;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        .auth-tab:hover {
            color: #4b5563;
        }

        .auth-tab.active {
            color: #111827;
        }

        .auth-tab.active::after {
            content: '';
            position: absolute;
            bottom: -14px;
            left: 0;
            width: 100%;
            height: 3px;
            background: #2274e0;
            box-shadow: 0 0 10px rgba(34, 116, 224, 0.4);
            border-radius: 10px;
        }

        .auth-input {
            width: 100%;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            padding: 18px 20px;
            border-radius: 16px;
            color: #111827;
            font-size: 1.05rem;
            margin-bottom: 18px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
            font-family: 'Plus Jakarta Sans', sans-serif;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        .auth-input::placeholder {
            color: #9ca3af;
            font-weight: 500;
        }

        .auth-input:focus {
            border-color: #2274e0;
            box-shadow: 0 0 0 4px rgba(34, 116, 224, 0.1);
        }

        .auth-btn {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #2c6ece 0%, #1a4da1 100%);
            color: white;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
            box-shadow: 0 8px 20px rgba(26, 77, 161, 0.25);
            font-family: 'Outfit', sans-serif;
        }

        .auth-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(26, 77, 161, 0.4);
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
        }

        .flash-card {
            background: #eff6ff;
            border-left: 4px solid #3b82f6;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            color: #1e40af;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 500;
            animation: fadeIn 0.4s ease-out;
        }

        .signup-form {
            display: none;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Floating Light Orbs */
        .glass-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.6;
            pointer-events: none;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: #bfdbfe;
            top: -150px;
            left: -100px;
            animation: float1 10s infinite alternate;
        }

        .orb-2 {
            width: 600px;
            height: 600px;
            background: #fecaca;
            bottom: -250px;
            right: 10vw;
            animation: float2 12s infinite alternate;
        }

        @keyframes float1 {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(50px, 50px);
            }
        }

        @keyframes float2 {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(-50px, -50px);
            }
        }

        @media (max-width: 1000px) {

            html,
            body {
                overflow-y: auto;
                overflow-x: hidden;
            }

            .welcome-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .hero-section {
                padding: 50px 20px;
                align-items: center;
                text-align: center;
            }

            .hero-title {
                font-size: 4rem;
            }

            .auth-section {
                padding: 20px;
                backdrop-filter: none;
                border: none;
                align-items: flex-start;
            }

            .bg-video {
                position: fixed;
            }

            .bg-overlay {
                position: fixed;
            }
        }
    </style>
</head>

<body>

    <!-- Immersive Background -->
    <img class="bg-video"
        src="https://images.unsplash.com/photo-1542296332-2e4473faf563?q=80&w=2670&auto=format&fit=crop"
        alt="Premium Travel Background">
    <div class="bg-overlay"></div>

    <!-- Cinematic Ambient Light Orbs -->
    <div class="glass-orb orb-1"></div>
    <div class="glass-orb orb-2"></div>

    <div class="welcome-container">

        <!-- Left Side: Hero Typography -->
        <div class="hero-section">
            <div class="travexa-logo">
                <span class="travexa-box">TRAV</span>exa
            </div>
            <h1 class="hero-title">Discover The<br>World In Style</h1>

        </div>

        <!-- Right Side: Frosted Glass Auth Interface -->
        <div class="auth-section">
            <div class="glass-panel">

                {% with messages = get_flashed_messages() %}
                {% if messages %}
                <div class="flash-card">
                    {% for message in messages %}
                    <p style="margin:0;">⚠️ {{ message }}</p>
                    {% endfor %}
                </div>
                {% endif %}
                {% endwith %}

                <div class="auth-tabs">
                    <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Log In</div>
                    <div class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</div>
                </div>

                <!-- Login State -->
                <form id="login-form" method="POST" action="/login">
                    <input class="auth-input" type="text" name="username" placeholder="Username" required>
                    <input class="auth-input" type="password" name="password" placeholder="Password" required>
                    <button type="submit" class="auth-btn">Enter Portal</button>
                </form>

                <!-- Sign Up State -->
                <form id="signup-form" class="signup-form" method="POST" action="/signup">
                    <input class="auth-input" type="text" name="username" placeholder="Choose a Username" required>
                    <input class="auth-input" type="password" name="password" placeholder="Create Password" required>
                    <input class="auth-input" type="password" name="confirm_password" placeholder="Confirm Password"
                        required>
                    <button type="submit" class="auth-btn">Create Account</button>
                </form>

            </div>
        </div>

    </div>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');

            if (tab === 'login') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                tabLogin.classList.add('active');
                tabSignup.classList.remove('active');

                // Add subtle animation when switching
                loginForm.style.animation = 'fadeIn 0.3s ease-out';
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                tabSignup.classList.add('active');
                tabLogin.classList.remove('active');

                signupForm.style.animation = 'fadeIn 0.3s ease-out';
            }
        }
    </script>
</body>

</html>
